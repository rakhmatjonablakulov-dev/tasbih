<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Муборак Тасбеҳ</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            /* Светлый, сияющий ночной небесный градиент (как на вашем фото, но светлее) */
            background: linear-gradient(180deg, #1b4f72 0%, #2980b9 50%, #115e4a 100%);
            color: #ffffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            overflow: hidden;
            position: relative;
        }
        /* Эффект звезд и лунного свечения на фоне */
        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                radial-gradient(white 1px, transparent 0),
                radial-gradient(rgba(241, 196, 15, 0.6) 1.5px, transparent 0);
            background-size: 50px 50px, 90px 90px;
            background-position: 0 0, 25px 25px;
            opacity: 0.35;
            pointer-events: none;
        }
        .header {
            text-align: center;
            width: 100%;
            z-index: 2;
        }
        .top-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            padding: 0 5px;
        }
        .lang-btn {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid #f1c40f;
            color: #f1c40f;
            padding: 5px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            backdrop-filter: blur(5px);
        }
        .title {
            font-size: 18px;
            font-weight: 600;
            color: #f1c40f;
            text-shadow: 0 2px 5px rgba(0,0,0,0.4);
        }
        /* Вкладки зикров (золотые рамки) */
        .zikr-selector {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            width: 100%;
            padding: 5px 0;
            scrollbar-width: none;
            z-index: 2;
        }
        .zikr-selector::-webkit-scrollbar {
            display: none;
        }
        .zikr-tab {
            background: rgba(15, 40, 30, 0.5);
            border: 1px solid rgba(241, 196, 15, 0.4);
            color: #e2e8f0;
            padding: 6px 14px;
            border-radius: 16px;
            font-size: 12px;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .zikr-tab.active {
            background: linear-gradient(135deg, #f1c40f, #d4ac0d);
            color: #0b3c2e;
            font-weight: bold;
            border-color: #f1c40f;
            box-shadow: 0 0 15px rgba(241, 196, 15, 0.6);
        }
        /* Центральный блок */
        .counter-container {
            text-align: center;
            margin: auto 0;
            z-index: 2;
        }
        .counter-value {
            font-size: 85px;
            font-weight: 700;
            color: #f1c40f;
            text-shadow: 0 0 25px rgba(241, 196, 15, 0.8);
            line-height: 1;
        }
        .counter-arabic {
            font-size: 26px;
            color: #f1c40f;
            margin-top: 5px;
            font-weight: bold;
            text-shadow: 0 2px 6px rgba(0,0,0,0.5);
        }
        .counter-label {
            font-size: 14px;
            color: #a3e4d7;
            margin-top: 6px;
            font-weight: 500;
        }
        /* Большая круглая кнопка тасбеха */
        .tap-button-container {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            margin-bottom: 10px;
            z-index: 2;
        }
        .tap-button {
            width: 190px;
            height: 190px;
            border-radius: 50%;
            background: radial-gradient(circle, #134e38 0%, #0b3827 100%);
            border: 3px solid #f1c40f;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), inset 0 4px 10px rgba(255, 255, 255, 0.2);
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #f1c40f;
            font-size: 28px;
            font-weight: bold;
            transition: transform 0.1s ease, box-shadow 0.1s ease;
            outline: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            text-shadow: 0 2px 4px rgba(0,0,0,0.6);
        }
        .tap-button:active {
            transform: scale(0.92);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3), inset 0 2px 5px rgba(0, 0, 0, 0.4);
        }
        .footer {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 2;
        }
        /* Золотистая кнопка сброса */
        .reset-btn {
            background: linear-gradient(135deg, #f1c40f, #d4ac0d);
            border: 1px solid #fff;
            color: #0b3c2e;
            padding: 10px 20px;
            border-radius: 14px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(241, 196, 15, 0.4);
        }
        .reset-btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="top-row">
            <div class="title">✨ Тасбеҳ ✨</div>
            <button class="lang-btn" id="langToggleBtn">🌐 O'zbek</button>
        </div>
        
        <!-- Вкладки зикров -->
        <div class="zikr-selector" id="zikrSelector">
            <div class="zikr-tab active" data-index="0">Субҳаналлоҳ</div>
            <div class="zikr-tab" data-index="1">Алҳамдулиллаҳ</div>
            <div class="zikr-tab" data-index="2">Ла илаҳа иллаллоҳ</div>
            <div class="zikr-tab" data-index="3">Астағфируллоҳ</div>
            <div class="zikr-tab" data-index="4">Саловат</div>
        </div>
    </div>

    <div class="counter-container">
        <div class="counter-value" id="counter">0</div>
        <div class="counter-arabic" id="arabicText">سُبْحَانَ ٱللَّهِ</div>
        <div class="counter-label" id="zikrLabel">Субҳаналлоҳ марта ўқилди</div>
    </div>

    <div class="tap-button-container">
        <button class="tap-button" id="tapBtn">Зикр</button>
    </div>

    <div class="footer">
        <span style="font-size: 11px; color: #a3e4d7; opacity: 0.8;">🌙 Kaaba & Moon Edition</span>
        <button class="reset-btn" id="resetBtn">Ноллаш 🔄</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const languages = [
            { code: 'uz', label: "🌐 O'zbek", tap: "Зикр", reset: "Ноллаш 🔄", suffix: "марта ўқилди" },
            { code: 'ru', label: "🌐 Русский", tap: "Зикр", reset: "Сброс 🔄", suffix: "прочитано раз" },
            { code: 'en', label: "🌐 English", tap: "Zikr", reset: "Reset 🔄", suffix: "times read" },
            { code: 'ar', label: "🌐 العربية", tap: "ذكر", reset: "إعادة تعيين 🔄", suffix: "مرة" }
        ];

        let langIndex = 0;

        const i18nZikrs = [
            { uz: "Субҳаналлоҳ", ru: "Субханаллах", en: "Subhanallah", ar: "سُبْحَانَ ٱللَّهِ", arabic: "سُبْحَانَ ٱللَّهِ", key: "tasbih_subhanallah" },
            { uz: "Алҳамдулиллаҳ", ru: "Альхамдулиллах", en: "Alhamdulillah", ar: "ٱلْحَمْدُ لِلَّهِ", arabic: "ٱلْحَمْدُ لِلَّهِ", key: "tasbih_alhamdulillah" },
            { uz: "Ла илаҳа иллаллоҳ", ru: "Ла илаха илляллах", en: "La ilaha illallah", ar: "لَا إِلَٰهَ إِلَّا ٱللَّهُ", arabic: "لَا إِلَٰهَ إِلَّا ٱللَّهُ", key: "tasbih_lailaha" },
            { uz: "Астағфируллоҳ", ru: "Астагфируллах", en: "Astaghfirullah", ar: "أَسْتَغْفِرُ ٱللَّهَ", arabic: "أَسْتَغْفِرُ ٱللَّهَ", key: "tasbih_astagfirullah" },
            { uz: "Саловат", ru: "Салават", en: "Salawat", ar: "الصلاة على النبي", arabic: "صَلَّى ٱللَّهُ عَلَيْهِ وَسَلَّمَ", key: "tasbih_salovat" }
        ];

        let currentZikrIndex = 0;

        const langToggleBtn = document.getElementById('langToggleBtn');
        const counterDisplay = document.getElementById('counter');
        const arabicText = document.getElementById('arabicText');
        const zikrLabel = document.getElementById('zikrLabel');
        const tapBtn = document.getElementById('tapBtn');
        const resetBtn = document.getElementById('resetBtn');
        const tabs = document.querySelectorAll('.zikr-tab');

        function updateUI() {
            const currentLang = languages[langIndex];
            langToggleBtn.textContent = currentLang.label;
            tapBtn.textContent = currentLang.tap;
            resetBtn.textContent = currentLang.reset;

            // Обновляем названия вкладок в зависимости от языка
            tabs.forEach((tab, idx) => {
                tab.textContent = i18nZikrs[idx][currentLang.code];
            });

            const zikrObj = i18nZikrs[currentZikrIndex];
            let count = localStorage.getItem(zikrObj.key) ? parseInt(localStorage.getItem(zikrObj.key)) : 0;
            
            counterDisplay.textContent = count;
            arabicText.textContent = zikrObj.arabic;
            zikrLabel.textContent = `${zikrObj[currentLang.code]} ${currentLang.suffix}`;

            tabs.forEach((tab, idx) => {
                if (idx === currentZikrIndex) {
                    tab.classList.add('active');
                } else {
                    tab.classList.remove('active');
                }
            });
        }

        updateUI();

        // Переключение языков по кругу
        langToggleBtn.addEventListener('click', () => {
            langIndex = (langIndex + 1) % languages.length;
            updateUI();
            if (tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
        });

        // Выбор зикра
        tabs.forEach((tab, idx) => {
            tab.addEventListener('click', () => {
                currentZikrIndex = idx;
                updateUI();
                if (tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
            });
        });

        // Клик на тапалку
        tapBtn.addEventListener('click', () => {
            const zikrObj = i18nZikrs[currentZikrIndex];
            let count = localStorage.getItem(zikrObj.key) ? parseInt(localStorage.getItem(zikrObj.key)) : 0;
            count++;
            
            localStorage.setItem(zikrObj.key, count);
            counterDisplay.textContent = count;

            if (tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('medium');
            }
        });

        // Сброс счетчика
        resetBtn.addEventListener('click', () => {
            const currentLang = languages[langIndex];
            const zikrObj = i18nZikrs[currentZikrIndex];
            
            if (confirm(`"${zikrObj[currentLang.code]}"?`)) {
                localStorage.setItem(zikrObj.key, 0);
                counterDisplay.textContent = 0;
                if (tg.HapticFeedback) {
                    tg.HapticFeedback.notificationOccurred('success');
                }
            }
        });
    </script>
</body>
</html>
