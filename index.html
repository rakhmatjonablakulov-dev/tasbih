<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Мукаммал Тасбеҳ</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: #ffffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            overflow: hidden;
        }
        .header {
            text-align: center;
            width: 100%;
        }
        .title {
            font-size: 20px;
            font-weight: 600;
            color: #00d2ff;
            margin-bottom: 10px;
        }
        /* Стили для выбора зикра (горизонтальный скролл) */
        .zikr-selector {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            width: 100%;
            padding: 5px 0;
            scrollbar-width: none; /* Firefox */
        }
        .zikr-selector::-webkit-scrollbar {
            display: none; /* Chrome, Safari */
        }
        .zikr-tab {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #a0aec0;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 13px;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.2s;
        }
        .zikr-tab.active {
            background: #00d2ff;
            color: #0f2027;
            font-weight: bold;
            border-color: #00d2ff;
            box-shadow: 0 0 10px rgba(0, 210, 255, 0.4);
        }
        .counter-container {
            text-align: center;
            margin: auto 0;
        }
        .counter-value {
            font-size: 75px;
            font-weight: 700;
            color: #ffffff;
            text-shadow: 0 0 20px rgba(0, 210, 255, 0.5);
        }
        .counter-label {
            font-size: 15px;
            color: #cbd5e0;
            margin-top: 5px;
        }
        .tap-button-container {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            margin-bottom: 20px;
        }
        .tap-button {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: linear-gradient(145deg, #00b4db, #0083b0);
            border: none;
            box-shadow: 0 10px 30px rgba(0, 131, 176, 0.5), inset 0 4px 6px rgba(255, 255, 255, 0.3);
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 26px;
            font-weight: bold;
            transition: transform 0.1s ease, box-shadow 0.1s ease;
            outline: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .tap-button:active {
            transform: scale(0.93);
            box-shadow: 0 5px 15px rgba(0, 131, 176, 0.4), inset 0 2px 4px rgba(0, 0, 0, 0.2);
        }
        .footer {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .reset-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
            padding: 10px 20px;
            border-radius: 12px;
            font-size: 14px;
            cursor: pointer;
        }
        .reset-btn:active {
            background: rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="title">📿 Мукаммал Тасбеҳ</div>
        <!-- Список кнопок переключения зикров -->
        <div class="zikr-selector" id="zikrSelector">
            <div class="zikr-tab active" data-index="0">Субҳаналлоҳ</div>
            <div class="zikr-tab" data-index="1">Алҳамдулиллаҳ</div>
            <div class="zikr-tab" data-index="2">Ла илаҳа иллаллоҳ</div>
            <div class="zikr-tab" data-index="3">Астағфируллоҳ</div>
            <div class="zikr-tab" data-index="4">Саловат</div>
        </div>
    </div>

    <div class="counter-container">
        <div class="counter-value" id="counter">0</div>
        <div class="counter-label" id="zikrLabel">Субҳаналлоҳ</div>
    </div>

    <div class="tap-button-container">
        <button class="tap-button" id="tapBtn">Зикр</button>
    </div>

    <div class="footer">
        <button class="reset-btn" id="resetBtn">Ноллаш 🔄</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // Массив зикров
        const zikrs = [
            { name: "Субҳаналлоҳ", key: "tasbih_subhanallah" },
            { name: "Алҳамдулиллаҳ", key: "tasbih_alhamdulillah" },
            { name: "Ла илаҳа иллаллоҳ", key: "tasbih_lailaha" },
            { name: "Астағфируллоҳ", key: "tasbih_astagfirullah" },
            { name: "Саловат", key: "tasbih_salovat" }
        ];

        let currentZikrIndex = 0;

        const counterDisplay = document.getElementById('counter');
        const zikrLabel = document.getElementById('zikrLabel'); // ИСПРАВЛЕНО ЗДЕСЬ
        const tapBtn = document.getElementById('tapBtn');
        const resetBtn = document.getElementById('resetBtn');
        const tabs = document.querySelectorAll('.zikr-tab');

        // Функция загрузки текущего зикра
        function loadCurrentZikr() {
            const zikr = zikrs[currentZikrIndex];
            let count = localStorage.getItem(zikr.key) ? parseInt(localStorage.getItem(zikr.key)) : 0;
            counterDisplay.textContent = count;
            zikrLabel.textContent = zikr.name;

            // Обновляем активную вкладку
            tabs.forEach((tab, idx) => {
                if (idx === currentZikrIndex) {
                    tab.classList.add('active');
                } else {
                    tab.classList.remove('active');
                }
            });
        }

        loadCurrentZikr();

        // Переключение по вкладкам
        tabs.forEach((tab) => {
            tab.addEventListener('click', () => {
                currentZikrIndex = parseInt(tab.getAttribute('data-index'));
                loadCurrentZikr();
                if (tg.HapticFeedback) {
                    tg.HapticFeedback.selectionChanged();
                }
            });
        });

        // Клик по главной кнопке тапалки
        tapBtn.addEventListener('click', () => {
            const zikr = zikrs[currentZikrIndex];
            let count = localStorage.getItem(zikr.key) ? parseInt(localStorage.getItem(zikr.key)) : 0;
            count++;
            
            localStorage.setItem(zikr.key, count);
            counterDisplay.textContent = count;

            if (tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('medium');
            }
        });

        // Сброс счетчика текущего зикра
        resetBtn.addEventListener('click', () => {
            const zikr = zikrs[currentZikrIndex];
            if (confirm(`"${zikr.name}" ҳисобини ноллашни хоҳлайсизми?`)) {
                localStorage.setItem(zikr.key, 0);
                counterDisplay.textContent = 0;
                if (tg.HapticFeedback) {
                    tg.HapticFeedback.notificationOccurred('success');
                }
            }
        });
    </script>
</body>
</html>
