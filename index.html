<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Муборак Тасбеҳ</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            /* Более светлый, сияющий ночной небесный градиент с лунным свечением */
            background: linear-gradient(135deg, #1b4f72, #2980b9, #16a085);
            color: #ffffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            overflow: hidden;
            position: relative;
        }
        /* Эффект звезд и лунного сияния на фоне */
        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                radial-gradient(white 1px, transparent 0),
                radial-gradient(rgba(255,255,255,0.8) 1.5px, transparent 0);
            background-size: 40px 40px, 70px 70px;
            background-position: 0 0, 20px 20px;
            opacity: 0.4;
            pointer-events: none;
        }
        .header {
            text-align: center;
            width: 100%;
            z-index: 2;
        }
        .lang-selector {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin-bottom: 8px;
        }
        .lang-btn {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid #f1c40f;
            color: #ffffff;
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 11px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .lang-btn.active {
            background: #f1c40f;
            color: #1b4f72;
            font-weight: bold;
        }
        .title {
            font-size: 20px;
            font-weight: 600;
            color: #f1c40f;
            margin-bottom: 8px;
            text-shadow: 0 2px 8px rgba(0,0,0,0.4);
        }
        .zikr-selector {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            width: 100%;
            padding: 5px 0;
            scrollbar-width: none;
            z-index: 2;
        }
        .zikr-selector::-webkit-scrollbar {
            display: none;
        }
        .zikr-tab {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(241, 196, 15, 0.4);
            color: #ffffff;
            padding: 7px 14px;
            border-radius: 20px;
            font-size: 12px;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .zikr-tab.active {
            background: linear-gradient(135deg, #f1c40f, #d4ac0d);
            color: #1b4f72;
            font-weight: bold;
            border-color: #f1c40f;
            box-shadow: 0 0 15px rgba(241, 196, 15, 0.6);
        }
        .counter-container {
            text-align: center;
            margin: auto 0;
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 25px 40px;
            border-radius: 25px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(6px);
            width: 100%;
            max-width: 320px;
            z-index: 2;
        }
        .counter-arabic {
            font-size: 24px;
            color: #f1c40f;
            margin-bottom: 5px;
            font-weight: bold;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }
        .counter-value {
            font-size: 75px;
            font-weight: 700;
            color: #ffffff;
            text-shadow: 0 0 25px rgba(241, 196, 15, 0.8);
            line-height: 1;
        }
        .counter-label {
            font-size: 14px;
            color: #e2e8f0;
            margin-top: 8px;
            font-weight: 500;
        }
        .tap-button-container {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            margin-bottom: 15px;
            z-index: 2;
        }
        .tap-button {
            width: 190px;
            height: 190px;
            border-radius: 50%;
            background: linear-gradient(145deg, #2980b9, #1b4f72);
            border: 3px solid #f1c40f;
            box-shadow: 0 10px 30px rgba(41, 128, 185, 0.6), inset 0 4px 10px rgba(255, 255, 255, 0.3);
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #f1c40f;
            font-size: 26px;
            font-weight: bold;
            transition: transform 0.1s ease, box-shadow 0.1s ease;
            outline: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            text-shadow: 0 2px 4px rgba(0,0,0,0.4);
        }
        .tap-button:active {
            transform: scale(0.92);
            background: linear-gradient(145deg, #1b4f72, #11354c);
        }
        .footer {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 2;
        }
        .reset-btn {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #ffffff;
            padding: 10px 20px;
            border-radius: 12px;
            font-size: 14px;
            cursor: pointer;
        }
        .reset-btn:active {
            background: rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="lang-selector">
            <button class="lang-btn active" data-lang="uz">O'zbek</button>
            <button class="lang-btn" data-lang="ru">Русский</button>
            <button class="lang-btn" data-lang="en">English</button>
            <button class="lang-btn" data-lang="ar">العربية</button>
        </div>
        <div class="title" id="appTitle">✨ Муборак Тасбеҳ ✨</div>
        
        <div class="zikr-selector" id="zikrSelector">
            <div class="zikr-tab active" data-index="0">Субҳаналлоҳ</div>
            <div class="zikr-tab" data-index="1">Алҳамдулиллаҳ</div>
            <div class="zikr-tab" data-index="2">Ла илаҳа иллаллоҳ</div>
            <div class="zikr-tab" data-index="3">Астағфируллоҳ</div>
            <div class="zikr-tab" data-index="4">Саловат</div>
        </div>
    </div>

    <div class="counter-container">
        <div class="counter-arabic" id="arabicText">سُبْحَانَ ٱللَّهِ</div>
        <div class="counter-value" id="counter">0</div>
        <div class="counter-label" id="zikrLabel">Субҳаналлоҳ</div>
    </div>

    <div class="tap-button-container">
        <button class="tap-button" id="tapBtn">Зикр</button>
    </div>

    <div class="footer">
        <span id="developerText" style="font-size: 12px; color: #f1c40f; opacity: 0.9;">🌙 Tasbih App</span>
        <button class="reset-btn" id="resetBtn">Ноллаш 🔄</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const i18n = {
            uz: {
                title: "✨ Муборак Тасбеҳ ✨",
                tap: "Зикр",
                reset: "Ноллаш 🔄",
                confirmReset: "ҳисобини ноллашни хоҳлайсизми?",
                zikrs: [
                    { name: "Субҳаналлоҳ", arabic: "سُبْحَانَ ٱللَّهِ", key: "tasbih_subhanallah" },
                    { name: "Алҳамдулиллаҳ", arabic: "ٱلْحَمْدُ لِلَّهِ", key: "tasbih_alhamdulillah" },
                    { name: "Ла илаҳа иллаллоҳ", arabic: "لَا إِلَٰهَ إِلَّا ٱللَّهُ", key: "tasbih_lailaha" },
                    { name: "Астағфируллоҳ", arabic: "أَسْتَغْفِرُ ٱللَّهَ", key: "tasbih_astagfirullah" },
                    { name: "Саловат", arabic: "صَلَّى ٱللَّهُ عَلَيْهِ وَسَلَّمَ", key: "tasbih_salovat" }
                ]
            },
            ru: {
                title: "✨ Благословенный Тасбих ✨",
                tap: "Зикр",
                reset: "Сброс 🔄",
                confirmReset: "сбросить счетчик для",
                zikrs: [
                    { name: "Субханаллах", arabic: "سُبْحَانَ ٱللَّهِ", key: "tasbih_subhanallah" },
                    { name: "Альхамдулиллах", arabic: "ٱلْحَمْدُ لِلَّهِ", key: "tasbih_alhamdulillah" },
                    { name: "Ла илаха илляллах", arabic: "لَا إِلَٰهَ إِلَّا ٱللَّهُ", key: "tasbih_lailaha" },
                    { name: "Астагфируллах", arabic: "أَسْتَغْفِرُ ٱللَّهَ", key: "tasbih_astagfirullah" },
                    { name: "Салават", arabic: "صَلَّى ٱللَّهُ عَلَيْهِ وَسَلَّمَ", key: "tasbih_salovat" }
                ]
            },
            en: {
                title: "✨ Blessed Tasbih ✨",
                tap: "Zikr",
                reset: "Reset 🔄",
                confirmReset: "reset counter for",
                zikrs: [
                    { name: "Subhanallah", arabic: "سُبْحَانَ ٱللَّهِ", key: "tasbih_subhanallah" },
                    { name: "Alhamdulillah", arabic: "ٱلْحَمْدُ لِلَّهِ", key: "tasbih_alhamdulillah" },
                    { name: "La ilaha illallah", arabic: "لَا إِلَٰهَ إِلَّا ٱللَّهُ", key: "tasbih_lailaha" },
                    { name: "Astaghfirullah", arabic: "أَسْتَغْفِرُ ٱللَّهَ", key: "tasbih_astagfirullah" },
                    { name: "Salawat", arabic: "صَلَّى ٱللَّهُ عَلَيْهِ وَسَلَّمَ", key: "tasbih_salovat" }
                ]
            },
            ar: {
                title: "✨ التسبيح المبارك ✨",
                tap: "ذكر",
                reset: "إعادة تعيين 🔄",
                confirmReset: "هل تريد تصفير عداد",
                zikrs: [
                    { name: "سُبْحَانَ ٱللَّهِ", arabic: "سُبْحَانَ ٱللَّهِ", key: "tasbih_subhanallah" },
                    { name: "ٱلْحَمْدُ لِلَّهِ", arabic: "ٱلْحَمْدُ لِلَّهِ", key: "tasbih_alhamdulillah" },
                    { name: "لَا إِلَٰهَ إِلَّا ٱللَّهُ", arabic: "لَا إِلَٰهَ إِلَّا ٱللَّهُ", key: "tasbih_lailaha" },
                    { name: "أَسْتَغْفِرُ ٱللَّهَ", arabic: "أَسْتَغْفِرُ ٱللَّهَ", key: "tasbih_astagfirullah" },
                    { name: "الصلاة على النبي", arabic: "صَلَّى ٱللَّهُ عَلَيْهِ وَسَلَّمَ", key: "tasbih_salovat" }
                ]
            }
        };

        let currentLang = localStorage.getItem('tasbih_lang') || 'uz';
        let currentZikrIndex = 0;

        const appTitle = document.getElementById('appTitle');
        const counterDisplay = document.getElementById('counter');
        const arabicText = document.getElementById('arabicText');
        const zikrLabel = document.getElementById('zikrLabel');
        const tapBtn = document.getElementById('tapBtn');
        const resetBtn = document.getElementById('resetBtn');
        const tabs = document.querySelectorAll('.zikr-tab');
        const langBtns = document.querySelectorAll('.lang-btn');

        function updateInterface() {
            const t = i18n[currentLang];
            appTitle.textContent = t.title;
            tapBtn.textContent = t.tap;
            resetBtn.textContent = t.reset;

            tabs.forEach((tab, idx) => {
                tab.textContent = t.zikrs[idx].name;
            });

            const zikr = t.zikrs[currentZikrIndex];
            let count = localStorage.getItem(zikr.key) ? parseInt(localStorage.getItem(zikr.key)) : 0;
            counterDisplay.textContent = count;
            zikrLabel.textContent = zikr.name;
            arabicText.textContent = zikr.arabic;

            langBtns.forEach(btn => {
                if (btn.getAttribute('data-lang') === currentLang) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });

            tabs.forEach((tab, idx) => {
                if (idx === currentZikrIndex) {
                    tab.classList.add('active');
                } else {
                    tab.classList.remove('active');
                }
            });
        }

        updateInterface();

        langBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                currentLang = btn.getAttribute('data-lang');
                localStorage.setItem('tasbih_lang', currentLang);
                updateInterface();
                if (tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
            });
        });

        tabs.forEach((tab, idx) => {
            tab.addEventListener('click', () => {
                currentZikrIndex = idx;
                updateInterface();
                if (tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
            });
        });

        tapBtn.addEventListener('click', () => {
            const zikr = i18n[currentLang].zikrs[currentZikrIndex];
            let count = localStorage.getItem(zikr.key) ? parseInt(localStorage.getItem(zikr.key)) : 0;
            count++;
            
            localStorage.setItem(zikr.key, count);
            counterDisplay.textContent = count;

            if (tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('medium');
            }
        });

        resetBtn.addEventListener('click', () => {
            const t = i18n[currentLang];
            const zikr = t.zikrs[currentZikrIndex];
            let confirmText = currentLang === 'ar' ? `هل تريد تصفير ${zikr.name}؟` : `"${zikr.name}" ${t.confirmReset}?`;
            
            if (confirm(confirmText)) {
                localStorage.setItem(zikr.key, 0);
                counterDisplay.textContent = 0;
                if (tg.HapticFeedback) {
                    tg.HapticFeedback.notificationOccurred('success');
                }
            }
        });
    </script>
</body>
</html>
