<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Муборак Тасбеҳ</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Рекламный скрипт Monetag -->
    <script src='//libtl.com/sdk.js' data-zone='12215662' data-sdk='show_12215662'></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background: linear-gradient(rgba(11, 38, 47, 0.3), rgba(5, 20, 25, 0.6)), 
                        url('https://images.unsplash.com/photo-1591604129939-f1efa4d9f7fa?q=80&w=1000&auto=format&fit=crop') no-repeat center center fixed;
            background-size: cover;
            color: #ffffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 12px 15px;
            overflow: hidden;
            position: relative;
        }

        /* Небесный слой с луной и звездами */
        .sky-elements {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 60%;
            pointer-events: none;
            z-index: 1;
        }

        /* Луна */
        .moon {
            position: absolute;
            top: 85px;
            left: 30px;
            width: 50px;
            height: 50px;
            background: radial-gradient(circle at 30% 30%, #fffdf0, #f1c40f);
            border-radius: 50%;
            box-shadow: 0 0 25px rgba(241, 196, 15, 0.7), 0 0 50px rgba(255, 255, 255, 0.4);
        }

        /* Мерцающие звезды на небе */
        .stars {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(white 1.5px, transparent 0),
                radial-gradient(rgba(241, 196, 15, 0.8) 2px, transparent 0),
                radial-gradient(rgba(255, 255, 255, 0.6) 1px, transparent 0);
            background-size: 60px 60px, 90px 90px, 45px 45px;
            background-position: 10px 15px, 40px 30px, 20px 50px;
            opacity: 0.8;
        }

        .header {
            text-align: center;
            width: 100%;
            z-index: 2;
        }
        .top-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
            padding: 0 5px;
        }
        .top-btns {
            display: flex;
            gap: 6px;
        }
        .lang-btn, .rating-btn {
            background: rgba(15, 40, 30, 0.75);
            border: 1px solid #f1c40f;
            color: #f1c40f;
            padding: 4px 10px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            backdrop-filter: blur(5px);
        }
        .title {
            font-size: 16px;
            font-weight: 600;
            color: #f1c40f;
            text-shadow: 0 2px 6px rgba(0,0,0,0.8);
        }

        /* Вкладки зикров */
        .zikr-selector {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            width: 100%;
            padding: 4px 0;
            scrollbar-width: none;
            z-index: 2;
        }
        .zikr-selector::-webkit-scrollbar {
            display: none;
        }
        .zikr-tab {
            background: rgba(10, 30, 25, 0.75);
            border: 1px solid rgba(241, 196, 15, 0.5);
            color: #e2e8f0;
            padding: 5px 12px;
            border-radius: 14px;
            font-size: 11px;
            white-space: nowrap;
            cursor: pointer;
            backdrop-filter: blur(4px);
            transition: all 0.3s ease;
        }
        .zikr-tab.active {
            background: linear-gradient(135deg, #f1c40f, #d4ac0d);
            color: #0b3c2e;
            font-weight: bold;
            border-color: #f1c40f;
            box-shadow: 0 0 15px rgba(241, 196, 15, 0.7);
        }

        /* Центральный блок счетчика */
        .counter-container {
            text-align: center;
            margin: auto 0;
            z-index: 2;
        }
        .total-counter-badge {
            font-size: 13px;
            color: #f1c40f;
            background: rgba(11, 38, 47, 0.7);
            border: 1px solid rgba(241, 196, 15, 0.4);
            padding: 4px 14px;
            border-radius: 20px;
            display: inline-block;
            margin-bottom: 5px;
            backdrop-filter: blur(4px);
            font-weight: 500;
        }
        .counter-value {
            font-size: 75px;
            font-weight: 700;
            color: #f1c40f;
            text-shadow: 0 0 25px rgba(241, 196, 15, 0.9), 0 2px 5px rgba(0,0,0,0.8);
            line-height: 1;
        }
        .counter-arabic {
            font-size: 22px;
            color: #f1c40f;
            margin-top: 4px;
            font-weight: bold;
            text-shadow: 0 2px 6px rgba(0,0,0,0.9);
        }
        .counter-label {
            font-size: 13px;
            color: #a3e4d7;
            margin-top: 4px;
            font-weight: 500;
            text-shadow: 0 1px 3px rgba(0,0,0,0.9);
        }

        /* Большая круглая кнопка тасбеха */
        .tap-button-container {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            margin-bottom: 5px;
            z-index: 2;
        }
        .tap-button {
            width: 165px;
            height: 165px;
            border-radius: 50%;
            background: radial-gradient(circle, #134e38 0%, #072e20 100%);
            border: 3px solid #f1c40f;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7), inset 0 4px 10px rgba(255, 255, 255, 0.25);
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #f1c40f;
            font-size: 26px;
            font-weight: bold;
            transition: transform 0.1s ease, box-shadow 0.1s ease;
            outline: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            text-shadow: 0 2px 4px rgba(0,0,0,0.7);
        }
        .tap-button:active {
            transform: scale(0.92);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5), inset 0 2px 5px rgba(0, 0, 0, 0.5);
        }

        /* Кнопка монетизации */
        .ads-button-container {
            width: 100%;
            display: flex;
            justify-content: center;
            margin-bottom: 8px;
            z-index: 2;
        }
        .ads-btn {
            background: linear-gradient(135deg, #f39c12, #d35400);
            border: 1px solid #f1c40f;
            color: #ffffff;
            width: 100%;
            max-width: 340px;
            padding: 8px 12px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: bold;
            text-align: center;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(243, 156, 18, 0.4);
            transition: transform 0.1s;
            line-height: 1.3;
        }
        .ads-btn:active {
            transform: scale(0.96);
        }

        .footer {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 2;
        }
        .reset-btn {
            background: linear-gradient(135deg, #f1c40f, #d4ac0d);
            border: 1px solid #fff;
            color: #0b3c2e;
            padding: 8px 16px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(241, 196, 15, 0.5);
        }
        .reset-btn:active {
            transform: scale(0.95);
        }

        /* Модальное окно рейтинга */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            backdrop-filter: blur(5px);
        }
        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        .modal-content {
            background: linear-gradient(135deg, #0b3c2e, #062e21);
            border: 2px solid #f1c40f;
            width: 90%;
            max-width: 340px;
            padding: 20px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        .modal-title {
            font-size: 18px;
            color: #f1c40f;
            margin-bottom: 12px;
            font-weight: bold;
        }
        .modal-body {
            font-size: 13px;
            color: #e2e8f0;
            margin-bottom: 20px;
            line-height: 1.5;
            text-align: left;
            background: rgba(0,0,0,0.2);
            padding: 12px;
            border-radius: 12px;
        }
        .modal-close-btn {
            background: linear-gradient(135deg, #f1c40f, #d4ac0d);
            border: none;
            color: #062e21;
            padding: 8px 20px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            font-size: 13px;
        }
    </style>
</head>
<body>

    <!-- Небесный слой с луной и звездами -->
    <div class="sky-elements">
        <div class="stars"></div>
        <div class="moon"></div>
    </div>

    <div class="header">
        <div class="top-row">
            <div class="title" id="appTitle">✨ Тасбеҳ ✨</div>
            <div class="top-btns">
                <button class="rating-btn" id="ratingBtn">⭐ Рейтинг</button>
                <button class="lang-btn" id="langToggleBtn">🌐 O'zbek</button>
            </div>
        </div>
        
        <!-- Вкладки зикров -->
        <div class="zikr-selector" id="zikrSelector">
            <div class="zikr-tab active" data-index="0">Субҳаналлоҳ</div>
            <div class="zikr-tab" data-index="1">Алҳамдулиллаҳ</div>
            <div class="zikr-tab" data-index="2">Ла илаҳа иллаллоҳ</div>
            <div class="zikr-tab" data-index="3">Астағфируллоҳ</div>
            <div class="zikr-tab" data-index="4">Саловат</div>
            <div class="zikr-tab" data-index="5">Бошқа зикрлар</div>
        </div>
    </div>

    <div class="counter-container">
        <div class="total-counter-badge" id="totalBadge">Жами зикр: 0</div>
        <div class="counter-value" id="counter">0</div>
        <div class="counter-arabic" id="arabicText">سُبْحَانَ ٱللَّهِ</div>
        <div class="counter-label" id="zikrLabel">Субҳаналлоҳ марта ўқилди</div>
    </div>

    <div class="tap-button-container">
        <button class="tap-button" id="tapBtn">Зикр</button>
    </div>

    <!-- Монетизационная кнопка с защитой от закрытия WebApp -->
    <div class="ads-button-container">
        <button class="ads-btn" id="adsBtn">
            <span id="adsTitleText">⭐ Хайирли ишлар учун ушбу кнопкани босинг ⭐</span><br>
            <span id="adsSubText" style="font-size: 10px; color: #ffeaa7; font-weight: normal;">Илтимос янги очилган сайтни 10-15 секунд кузатинг.</span>
        </button>
    </div>

    <div class="footer">
        <span style="font-size: 11px; color: #f1c40f; opacity: 0.9; text-shadow: 0 1px 3px rgba(0,0,0,0.9);">🌙 Kaaba & Moon Edition</span>
        <button class="reset-btn" id="resetBtn">Ноллаш 🔄</button>
    </div>

    <!-- Модальное окно рейтинга -->
    <div class="modal-overlay" id="ratingModal">
        <div class="modal-content">
            <div class="modal-title" id="modalTitleText">🏆 Рейтинг</div>
            <div class="modal-body" id="ratingModalBody">
                Ҳисобланмоқда...
            </div>
            <button class="modal-close-btn" id="closeModalBtn">Ёпиш</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const languages = [
            { 
                code: 'uz', 
                label: "🌐 O'zbek", 
                ratingText: "⭐ Рейтинг", 
                totalText: "Жами зикр", 
                tap: "Зикр", 
                reset: "Ноллаш 🔄", 
                suffix: "марта ўқилди",
                adsTitle: "⭐ Хайирли ишлар учун ушбу кнопкани босинг ⭐",
                adsSub: "Илтимос янги очилган сайтни 10-15 секунд кузатинг.",
                modalTitle: "🏆 Сизнинг натижалар ва рейтинг",
                closeBtn: "Ёпиш"
            },
            { 
                code: 'ru', 
                label: "🌐 Русский", 
                ratingText: "⭐ Рейтинг", 
                totalText: "Всего зикров", 
                tap: "Зикр", 
                reset: "Сброс 🔄", 
                suffix: "прочитано раз",
                adsTitle: "⭐ Нажмите эту кнопку для благого дела ⭐",
                adsSub: "Пожалуйста, посмотрите открывшийся сайт 10-15 секунд.",
                modalTitle: "🏆 Ваши результаты и рейтинг",
                closeBtn: "Закрыть"
            },
            { 
                code: 'en', 
                label: "🌐 English", 
                ratingText: "⭐ Rating", 
                totalText: "Total Zikr", 
                tap: "Zikr", 
                reset: "Reset 🔄", 
                suffix: "times read",
                adsTitle: "⭐ Click this button for a good deed ⭐",
                adsSub: "Please view the opened website for 10-15 seconds.",
                modalTitle: "🏆 Your Results & Rating",
                closeBtn: "Close"
            },
            { 
                code: 'ar', 
                label: "🌐 العربية", 
                ratingText: "⭐ الترتيب", 
                totalText: "مجموع الأذكار", 
                tap: "ذكر", 
                reset: "إعادة تعيين 🔄", 
                suffix: "مرة",
                adsTitle: "⭐ انقر فوق هذا الزر للعمل الصالح ⭐",
                adsSub: "يرجى مشاهدة الموقع المفتوح لمدة 10-15 ثانية.",
                modalTitle: "🏆 نتائجك وترتيبك",
                closeBtn: "إغلاق"
            }
        ];

        let langIndex = 0;

        const i18nZikrs = [
            { uz: "Субҳаналлоҳ", ru: "Субханаллах", en: "Subhanallah", ar: "سُبْحَانَ ٱللَّهِ", arabic: "سُبْحَانَ ٱللَّهِ", key: "tasbih_subhanallah" },
            { uz: "Алҳамдулиллаҳ", ru: "Альхамдулиллах", en: "Alhamdulillah", ar: "ٱلْحَمْدُ لِلَّهِ", arabic: "ٱلْحَمْدُ لِلَّهِ", key: "tasbih_alhamdulillah" },
            { uz: "Ла илаҳа иллаллоҳ", ru: "Ла илаха илляллах", en: "La ilaha illallah", ar: "لَا إِلَٰهَ إِلَّا ٱللَّهُ", arabic: "لَا إِلَٰهَ إِلَّا ٱللَّهُ", key: "tasbih_lailaha" },
            { uz: "Астағфируллоҳ", ru: "Астагфируллах", en: "Astaghfirullah", ar: "أَسْتَغْفِرُ ٱللَّهَ", arabic: "أَسْتَغْفِرُ ٱللَّهَ", key: "tasbih_astagfirullah" },
            { uz: "Саловат", ru: "Салават", en: "Salawat", ar: "الصلاة على النبي", arabic: "صَلَّى ٱللَّهُ عَلَيْهِ وَسَلَّمَ", key: "tasbih_salovat" },
            { uz: "Бошқа зикрлар", ru: "Другие зикры", en: "Other Zikr", ar: "أذكار أخرى", arabic: "لَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِٱللَّهِ", key: "tasbih_other" }
        ];

        let currentZikrIndex = 0;

        const langToggleBtn = document.getElementById('langToggleBtn');
        const ratingBtn = document.getElementById('ratingBtn');
        const counterDisplay = document.getElementById('counter');
        const totalBadge = document.getElementById('totalBadge');
        const arabicText = document.getElementById('arabicText');
        const zikrLabel = document.getElementById('zikrLabel');
        const tapBtn = document.getElementById('tapBtn');
        const adsBtn = document.getElementById('adsBtn');
        const adsTitleText = document.getElementById('adsTitleText');
        const adsSubText = document.getElementById('adsSubText');
        const resetBtn = document.getElementById('resetBtn');
        const tabs = document.querySelectorAll('.zikr-tab');
        
        const ratingModal = document.getElementById('ratingModal');
        const modalTitleText = document.getElementById('modalTitleText');
        const ratingModalBody = document.getElementById('ratingModalBody');
        const closeModalBtn = document.getElementById('closeModalBtn');

        function calculateTotalZikr() {
            let total = 0;
            i18nZikrs.forEach(zikr => {
                let val = localStorage.getItem(zikr.key) ? parseInt(localStorage.getItem(zikr.key)) : 0;
                total += val;
            });
            return total;
        }

        function updateUI() {
            const currentLang = languages[langIndex];
            langToggleBtn.textContent = currentLang.label;
            ratingBtn.textContent = currentLang.ratingText;
            tapBtn.textContent = currentLang.tap;
            resetBtn.textContent = currentLang.reset;
            
            adsTitleText.textContent = currentLang.adsTitle;
            adsSubText.textContent = currentLang.adsSub;
            
            modalTitleText.textContent = currentLang.modalTitle;
            closeModalBtn.textContent = currentLang.closeBtn;

            tabs.forEach((tab, idx) => {
                tab.textContent = i18nZikrs[idx][currentLang.code];
            });

            const zikrObj = i18nZikrs[currentZikrIndex];
            let count = localStorage.getItem(zikrObj.key) ? parseInt(localStorage.getItem(zikrObj.key)) : 0;
            
            counterDisplay.textContent = count;
            totalBadge.textContent = `${currentLang.totalText}: ${calculateTotalZikr()}`;
            arabicText.textContent = zikrObj.arabic;
            zikrLabel.textContent = `${zikrObj[currentLang.code]} ${currentLang.suffix}`;

            tabs.forEach((tab, idx) => {
                if (idx === currentZikrIndex) {
                    tab.classList.add('active');
                } else {
                    tab.classList.remove('active');
                }
            });
        }

        updateUI();

        langToggleBtn.addEventListener('click', () => {
            langIndex = (langIndex + 1) % languages.length;
            updateUI();
            if (tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
        });

        ratingBtn.addEventListener('click', () => {
            let total = calculateTotalZikr();
            let rank = total > 500 ? "🌟 Мусофир (Фаол)" : total > 100 ? "⭐ Зокир" : "🌱 Бошловчи";
            
            ratingModalBody.innerHTML = `
                👤 Фойдаланувчи: <b>${tg.initDataUnsafe?.user?.first_name || 'Ҳурматли меҳмон'}</b><br><br>
                📊 Жами зикрларингиз: <b>${total} та</b><br>
                🏅 Сизнинг даражангиз: <b>${rank}</b><br><br>
                <i>💡 Эслатма: Онлайн глобал рейтинг тизими кейинги янгиланишда қўшилади!</i>
            `;
            ratingModal.classList.add('active');
            if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
        });

        closeModalBtn.addEventListener('click', () => {
            ratingModal.classList.remove('active');
            if (tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
        });

        tabs.forEach((tab, idx) => {
            tab.addEventListener('click', () => {
                currentZikrIndex = idx;
                updateUI();
                if (tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
            });
        });

        tapBtn.addEventListener('click', () => {
            const zikrObj = i18nZikrs[currentZikrIndex];
            let count = localStorage.getItem(zikrObj.key) ? parseInt(localStorage.getItem(zikrObj.key)) : 0;
            count++;
            
            localStorage.setItem(zikrObj.key, count);
            counterDisplay.textContent = count;
            totalBadge.textContent = `${languages[langIndex].totalText}: ${calculateTotalZikr()}`;

            if (tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('medium');
            }
        });

        // Безопасный вызов рекламы без сворачивания тапалки
        adsBtn.addEventListener('click', () => {
            try {
                if (typeof show_12215
