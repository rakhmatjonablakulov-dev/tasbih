<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Муборак Тасбеҳ</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Рекламный скрипт Monetag -->
    <script src='//libtl.com/sdk.js' data-zone='12215662' data-sdk='show_12215662'></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background: linear-gradient(rgba(11, 38, 47, 0.3), rgba(5, 20, 25, 0.6)), 
                        url('https://images.unsplash.com/photo-1591604129939-f1efa4d9f7fa?q=80&w=1000&auto=format&fit=crop') no-repeat center center fixed;
            background-size: cover;
            color: #ffffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 12px 15px;
            overflow: hidden;
            position: relative;
        }

        /* Небесный слой с луной и звездами */
        .sky-elements {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 60%;
            pointer-events: none;
            z-index: 1;
        }

        /* Луна */
        .moon {
            position: absolute;
            top: 85px;
            left: 30px;
            width: 50px;
            height: 50px;
            background: radial-gradient(circle at 30% 30%, #fffdf0, #f1c40f);
            border-radius: 50%;
            box-shadow: 0 0 25px rgba(241, 196, 15, 0.7), 0 0 50px rgba(255, 255, 255, 0.4);
        }

        /* Мерцающие звезды на небе */
        .stars {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(white 1.5px, transparent 0),
                radial-gradient(rgba(241, 196, 15, 0.8) 2px, transparent 0),
                radial-gradient(rgba(255, 255, 255, 0.6) 1px, transparent 0);
            background-size: 60px 60px, 90px 90px, 45px 45px;
            background-position: 10px 15px, 40px 30px, 20px 50px;
            opacity: 0.8;
        }

        .header {
            text-align: center;
            width: 100%;
            z-index: 2;
        }
        .top-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
            padding: 0 5px;
        }
        .top-btns {
            display: flex;
            gap: 6px;
        }
        .lang-btn, .rating-btn {
            background: rgba(15, 40, 30, 0.75);
            border: 1px solid #f1c40f;
            color: #f1c40f;
            padding: 4px 10px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            backdrop-filter: blur(5px);
        }
        .title {
            font-size: 16px;
            font-weight: 600;
            color: #f1c40f;
            text-shadow: 0 2px 6px rgba(0,0,0,0.8);
        }

        /* Вкладки зикров */
        .zikr-selector {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            width: 100%;
            padding: 4px 0;
            scrollbar-width: none;
            z-index: 2;
        }
        .zikr-selector::-webkit-scrollbar {
            display: none;
        }
        .zikr-tab {
            background: rgba(10, 30, 25, 0.75);
            border: 1px solid rgba(241, 196, 15, 0.5);
            color: #e2e8f0;
            padding: 5px 12px;
            border-radius: 14px;
            font-size: 11px;
            white-space: nowrap;
            cursor: pointer;
            backdrop-filter: blur(4px);
            transition: all 0.3s ease;
        }
        .zikr-tab.active {
            background: linear-gradient(135deg, #f1c40f, #d4ac0d);
            color: #0b3c2e;
            font-weight: bold;
            border-color: #f1c40f;
            box-shadow: 0 0 15px rgba(241, 196, 15, 0.7);
        }

        /* Центральный блок счетчика */
        .counter-container {
            text-align: center;
            margin: auto 0;
            z-index: 2;
        }
        .total-counter-badge {
            font-size: 13px;
            color: #f1c40f;
            background: rgba(11, 38, 47, 0.7);
            border: 1px solid rgba(241, 196, 15, 0.4);
            padding: 4px 14px;
            border-radius: 20px;
            display: inline-block;
            margin-bottom: 5px;
            backdrop-filter: blur(4px);
            font-weight: 500;
        }
        .counter-value {
            font-size: 75px;
            font-weight: 700;
            color: #f1c40f;
            text-shadow: 0 0 25px rgba(241, 196, 15, 0.9), 0 2px 5px rgba(0,0,0,0.8);
            line-height: 1;
        }
        .counter-arabic {
            font-size: 22px;
            color: #f1c40f;
            margin-top: 4px;
            font-weight: bold;
            text-shadow: 0 2px 6px rgba(0,0,0,0.9);
        }
        .counter-label {
            font-size: 13px;
            color: #a3e4d7;
            margin-top: 4px;
            font-weight: 500;
            text-shadow: 0 1px 3px rgba(0,0,0,0.9);
        }

        /* Большая круглая кнопка тасбеха */
        .tap-button-container {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            margin-bottom: 5px;
            z-index: 2;
        }
        .tap-button {
            width: 165px;
            height: 165px;
            border-radius: 50%;
            background: radial-gradient(circle, #134e38 0%, #072e20 100%);
            border: 3px solid #f1c40f;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7), inset 0 4px 10px rgba(255, 255, 255, 0.25);
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #f1c40f;
            font-size: 26px;
            font-weight: bold;
            transition: transform 0.1s ease, box-shadow 0.1s ease;
            outline: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            text-shadow: 0 2px 4px rgba(0,0,0,0.7);
        }
        .tap-button:active {
            transform: scale(0.92);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5), inset 0 2px 5px rgba(0, 0, 0, 0.5);
        }

        /* Кнопка монетизации */
        .ads-button-container {
            width: 100%;
            display: flex;
            justify-content: center;
            margin-bottom: 8px;
            z-index: 2;
        }
        .ads-btn {
            background: linear-gradient(135deg, #f39c12, #d35400);
            border: 1px solid #f1c40f;
            color: #ffffff;
            width: 100%;
            max-width: 340px;
            padding: 8px 12px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: bold;
            text-align: center;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(243, 156, 18, 0.4);
            transition: transform 0.1s;
            line-height: 1.3;
        }
        .ads-btn:active {
            transform: scale(0.96);
        }

        .footer {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 2;
        }
        .reset-btn {
            background: linear-gradient(135deg, #f1c40f, #d4ac0d);
            border: 1px solid #fff;
            color: #0b3c2e;
            padding: 8px 16px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(241, 196, 15, 0.5);
        }
        .reset-btn:active {
            transform: scale(0.95);
        }

        /* Модальное окно рейтинга */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            backdrop-filter: blur(5px);
        }
        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        .modal-content {
            background: linear-gradient(135deg, #0b3c2e, #062e21);
            border: 2px solid #f1c40f;
            width: 90%;
            max-width: 340px;
            padding: 20px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        .modal-title {
            font-size: 18px;
            color: #f1c40f;
            margin-bottom: 12px;
            font-weight: bold;
        }
        .modal-body {
            font-size: 13px;
            color: #e2e8f0;
            margin-bottom: 20px;
            line-height: 1.5;
            text-align: left;
            background: rgba(0,0,0,0.2);
            padding: 12px;
            border-radius: 12px;
        }
        .modal-close-btn {
            background: linear-gradient(135deg, #f1c40f, #d4ac0d);
            border: none;
            color: #062e21;
            padding: 8px 20px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            font-size: 13px;
        }
    </style>
</head>
<body>

    <!-- Небесный слой с луной и звездами -->
    <div class="sky-elements">
        <div class="stars"></div>
        <div class="moon"></div>
    </div>

    <div class="header">
        <div class="top-row">
            <div class="title" id="appTitle">✨ Тасбеҳ ✨</div>
            <div class="top-btns">
                <button class="rating-btn" id="ratingBtn">⭐ Рейтинг</button>
                <button class="lang-btn" id="langToggleBtn">🌐 O'zbek</button>
            </div>
        </div>
        
        <!-- Вкладки зикров -->
        <div class="zikr-selector" id="zikrSelector">
            <div class="zikr-tab active" data-index="0">Субҳаналлоҳ</div>
            <div class="zikr-tab" data-index="1">Алҳамдулиллаҳ</div>
            <div class="zikr-tab" data-index="2">Ла илаҳа иллаллоҳ</div>
            <div class="zikr-tab" data-index="3">Астағфируллоҳ</div>
            <div class="zikr-tab" data-index="4">Саловат</div>
            <div class="zikr-tab" data-index="5">Бошқа зикрлар</div>
        </div>
    </div>
