<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Тасбеҳ Тапалка</title>
    <!-- Подключаем Telegram Web App скрипт -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: #ffffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 30px 20px;
            overflow: hidden;
        }
        .header {
            text-align: center;
        }
        .title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 5px;
            color: #00d2ff;
        }
        .subtitle {
            font-size: 14px;
            color: #a0aec0;
        }
        .counter-container {
            text-align: center;
        }
        .counter-value {
            font-size: 70px;
            font-weight: 700;
            color: #ffffff;
            text-shadow: 0 0 20px rgba(0, 210, 255, 0.5);
        }
        .counter-label {
            font-size: 16px;
            color: #cbd5e0;
            margin-top: 5px;
        }
        .tap-button-container {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            flex-grow: 1;
        }
        .tap-button {
            width: 220px;
            height: 220px;
            border-radius: 50%;
            background: linear-gradient(145deg, #00b4db, #0083b0);
            border: none;
            box-shadow: 0 10px 30px rgba(0, 131, 176, 0.5), inset 0 4px 6px rgba(255, 255, 255, 0.3);
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 28px;
            font-weight: bold;
            transition: transform 0.1s ease, box-shadow 0.1s ease;
            outline: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .tap-button:active {
            transform: scale(0.93);
            box-shadow: 0 5px 15px rgba(0, 131, 176, 0.4), inset 0 2px 4px rgba(0, 0, 0, 0.2);
        }
        .footer {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .reset-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
            padding: 10px 20px;
            border-radius: 12px;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .reset-btn:active {
            background: rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="title">📿 Субҳаналлоҳ</div>
        <div class="subtitle">Зикрлар ҳисоблагичи</div>
    </div>

    <div class="counter-container">
        <div class="counter-value" id="counter">0</div>
        <div class="counter-label">марта ўқилди</div>
    </div>

    <div class="tap-button-container">
        <button class="tap-button" id="tapBtn">Зикр</button>
    </div>

    <div class="footer">
        <button class="reset-btn" id="resetBtn">Ноллаш 🔄</button>
    </div>

    <script>
        // Инициализация Telegram Web App
        const tg = window.Telegram.WebApp;
        tg.expand();

        let count = localStorage.getItem('tasbih_count') ? parseInt(localStorage.getItem('tasbih_count')) : 0;
        
        const counterDisplay = document.getElementById('counter');
        const tapBtn = document.getElementById('tapBtn');
        const resetBtn = document.getElementById('resetBtn');

        counterDisplay.textContent = count;

        tapBtn.addEventListener('click', () => {
            count++;
            counterDisplay.textContent = count;
            localStorage.setItem('tasbih_count', count);

            // Вибрация в Telegram (если поддерживается)
            if (tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('medium');
            }
        });

        resetBtn.addEventListener('click', () => {
            if (confirm("Ҳисобни ноллашни хоҳлайсизми?")) {
                count = 0;
                counterDisplay.textContent = count;
                localStorage.setItem('tasbih_count', count);
                if (tg.HapticFeedback) {
                    tg.HapticFeedback.notificationOccurred('success');
                }
            }
        });
    </script>
</body>
</html>
